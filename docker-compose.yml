services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:-}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-gpt-oss-20b}
      HINDSIGHT_API_WORKER_ID: code-review-hindsight
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: sqlite:///./data/code_review_agent.db
      HINDSIGHT_API_URL: http://hindsight:8888
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.15}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      MAX_DIFF_CHARS: ${MAX_DIFF_CHARS:-60000}
      CORS_ORIGINS: http://localhost:8000
    depends_on:
      - hindsight
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  hindsight-data:
  app-data:
